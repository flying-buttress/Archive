<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lloyd McCullough — Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0b0a;
    --fg: #f3f1ea;
    --fg-dim: rgba(243,241,234,0.55);
    --accent: #c89b3c;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', sans-serif;
    height: 100%;
    overflow: hidden;
  }

  .mark{
    position: fixed;
    top: 28px;
    left: 28px;
    z-index: 20;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg);
    mix-blend-mode: difference;
  }

  .counter{
    position: fixed;
    bottom: 28px;
    right: 28px;
    z-index: 20;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--fg);
    mix-blend-mode: difference;
  }

  .stage{
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  .stage img{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  .stage img.active{
    opacity: 1;
  }

  .zone{
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    z-index: 10;
    cursor: pointer;
  }

  .zone.left{ left: 0; }
  .zone.right{ right: 0; }

  @media (prefers-reduced-motion: reduce){
    .stage img{ transition: none; }
  }
</style>
</head>
<body>

  <div class="mark">Lloyd McCullough — Archive</div>
  <div class="counter" id="counter">01 / 06</div>

  <div class="stage" id="stage">
    <!-- images are inserted here by script -->
    <div class="zone left" id="zoneLeft" aria-label="Previous photo"></div>
    <div class="zone right" id="zoneRight" aria-label="Next photo"></div>
  </div>

<script>
  // Replace these with your own photo URLs or file paths, in order.
  const photos = [
  "photos/20241127_004.jpg",
  "photos/20241109_013.jpg",
  "photos/20240830_059.jpg",
  "photos/20230217_0046.jpg",
  "photos/20220730_0016.jpg"
];

  const stage = document.getElementById('stage');
  const counter = document.getElementById('counter');
  const zoneLeft = document.getElementById('zoneLeft');
  const zoneRight = document.getElementById('zoneRight');

  let current = 0;
  const imgEls = [];

  // preload all images into the stage, stacked, only one visible at a time
  photos.forEach((src, i) => {
    const img = document.createElement('img');
    img.src = src;
    if(i === 0) img.classList.add('active');
    stage.insertBefore(img, zoneLeft);
    imgEls.push(img);
  });

  function show(index){
    current = (index + photos.length) % photos.length;
    imgEls.forEach((img, i) => img.classList.toggle('active', i === current));
    counter.textContent = String(current + 1).padStart(2, '0') + ' / ' + String(photos.length).padStart(2, '0');
  }

  function next(){ show(current + 1); }
  function prev(){ show(current - 1); }

  zoneLeft.addEventListener('click', prev);
  zoneRight.addEventListener('click', next);

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowRight') next();
    if(e.key === 'ArrowLeft') prev();
  });

  show(0);
</script>

</body>
</html>
