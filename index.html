<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lloyd McCullough<br>Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0b0a;
    --fg: #f3f1ea;
    --fg-dim: rgba(243,241,234,0.55);
    --accent: #c89b3c;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', sans-serif;
    height: 100%;
    overflow: hidden;
  }

  .mark{
    position: fixed;
    top: 28px;
    left: 28px;
    z-index: 20;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg);
    mix-blend-mode: difference;
  }

  .counter{
    position: fixed;
    bottom: 28px;
    right: 28px;
    z-index: 20;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--fg);
    mix-blend-mode: difference;
  }

  .stage{
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  .stage img{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  .stage img.active{
    opacity: 1;
  }

  .zone{
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    z-index: 10;
    cursor: pointer;
  }

  .zone.left{ left: 0; }
  .zone.right{ right: 0; }

  @media (prefers-reduced-motion: reduce){
    .stage img{ transition: none; }
  }
  .info-btn{
  position: fixed;
  bottom: 28px;
  left: 28px;
  z-index: 20;
  border: none;
  background: transparent;
  color: var(--fg);
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  cursor: pointer;
  mix-blend-mode: difference;
}

.info-overlay{
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(11,11,10,0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.info-overlay.open{
  opacity: 1;
  pointer-events: auto;
}

.info-panel{
  position: relative;
  text-align: center;
  color: var(--fg);
}

.info-name{
  font-size: 18px;
  font-weight: 500;
  margin-bottom: 10px;
}

.info-line{
  font-size: 13px;
  color: var(--fg-dim);
  margin-top: 6px;
}

.info-line a{
  color: var(--fg);
  text-decoration: none;
  border-bottom: 1px solid var(--accent);
}

.info-close{
  position: absolute;
  top: -40px;
  right: -10px;
  background: none;
  border: none;
  color: var(--fg);
  font-size: 24px;
  cursor: pointer;
}
</style>
</head>
<body>

  <div class="mark">Lloyd McCullough<br>Archive</div>
  <div class="counter" id="counter">01 / 06</div>

  <button class="info-btn" id="infoBtn">Info</button>

<div class="info-overlay" id="infoOverlay">
  <div class="info-panel">
    <button class="info-close" id="infoClose" aria-label="Close">&times;</button>
    <p class="info-name">Lloyd McCullough</p>
    <p class="info-line">Advertising &amp; Commercial Photography</p>
    <p class="info-line">New York, NY</p>
    <p class="info-line"><a href="mailto:lloyd@lloydmccullough.com">lloyd@lloydmccullough.com</a></p>
    <p class="info-line"><a href="https://instagram.com/lloyd_mccullough" target="_blank">@lloyd_mccullough</a></p>
  </div>
</div>

  <div class="stage" id="stage">
    <!-- images are inserted here by script -->
    <div class="zone left" id="zoneLeft" aria-label="Previous photo"></div>
    <div class="zone right" id="zoneRight" aria-label="Next photo"></div>
  </div>

<script>


  const stage = document.getElementById('stage');
const counter = document.getElementById('counter');
const zoneLeft = document.getElementById('zoneLeft');
const zoneRight = document.getElementById('zoneRight');

let current = 0;
let imgEls = [];

// Fisher-Yates shuffle
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Pulls the current file list from your GitHub repo's photos folder
fetch('https://api.github.com/repos/flying-buttress/Archive/contents/photos')
  .then(res => res.json())
  .then(files => {
    const photos = shuffle(
      files
        .filter(f => /\.(jpe?g|png|webp)$/i.test(f.name))
        .map(f => 'photos/' + f.name)
    );

    // Add captions here for specific photos — anything not listed just shows the counter
const captions = {
  "20220720_0201.jpg": "The National",
  "20220614_0392.jpg": "Phoebe Bridgers",
  "20220614_0533.jpg": "Phoebe Bridgers",
  "20241030_080.jpg": "Cassandra Jenkins",
  "20250402_0145.jpg": "The Weather Station"
};

    photos.forEach((src, i) => {
      const img = document.createElement('img');
      img.src = src;
      if (i === 0) img.classList.add('active');
      stage.insertBefore(img, zoneLeft);
      imgEls.push(img);
    });

    function show(index) {
  current = (index + photos.length) % photos.length;
  imgEls.forEach((img, i) => img.classList.toggle('active', i === current));

  const filename = photos[current].split('/').pop();
  counter.textContent = captions[filename] || '';
}


    function next() { show(current + 1); }
    function prev() { show(current - 1); }

    zoneLeft.addEventListener('click', prev);
    zoneRight.addEventListener('click', next);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft') prev();
    });

    show(0);
  });
  const infoBtn = document.getElementById('infoBtn');
const infoOverlay = document.getElementById('infoOverlay');
const infoClose = document.getElementById('infoClose');

infoBtn.addEventListener('click', () => infoOverlay.classList.add('open'));
infoClose.addEventListener('click', () => infoOverlay.classList.remove('open'));
infoOverlay.addEventListener('click', (e) => {
  if(e.target === infoOverlay) infoOverlay.classList.remove('open');
});
</script>

</body>
</html>
